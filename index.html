<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krunal Ambaliya | Web Developer & Python Developer</title>
    <meta name="description" content="Portfolio of Krunal Ambaliya - Web Developer, Python Developer, AI & Cyber Security Enthusiast based in Gujarat, India." />
    <meta property="og:title" content="Krunal Ambaliya | Web Developer & Python Developer" />
    <meta property="og:description" content="Portfolio of Krunal Ambaliya - Web Developer, Python Developer, AI & Cyber Security Enthusiast based in Gujarat, India." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: page paints right away with system fonts, swaps in when ready -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..800;1,300..800&family=Plus+Jakarta+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <script>
      // Apply saved theme before first paint (no light/dark flash; loader matches theme)
      try {
        if ((localStorage.getItem('portfolio_theme') || 'dark') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <style>
      #boot {
        --bg: #f8fafc; --fg: #0f172a; --dim: #94a3b8; --acc: #2563eb; --ok: #059669; --grid: rgba(15, 23, 42, 0.06); --scan: rgba(37, 99, 235, 0.08);
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: var(--bg); color: var(--fg);
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        transition: opacity 0.45s ease, visibility 0.45s ease;
        overflow: hidden;
      }
      .dark #boot { --bg: #08090d; --fg: #e2e8f0; --dim: #475569; --acc: #60a5fa; --ok: #34d399; --grid: rgba(255, 255, 255, 0.045); --scan: rgba(96, 165, 250, 0.08); }
      #boot.boot-done { opacity: 0; visibility: hidden; pointer-events: none; }
      #boot::before {
        content: ''; position: absolute; inset: 0;
        background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 32px 32px;
        -webkit-mask-image: radial-gradient(circle at center, #000 0%, transparent 70%);
        mask-image: radial-gradient(circle at center, #000 0%, transparent 70%);
      }
      #boot::after {
        content: ''; position: absolute; left: 0; right: 0; top: 0; height: 120px;
        background: linear-gradient(to bottom, transparent, var(--scan), transparent);
        transform: translateY(-120px);
        animation: boot-scan 2.4s linear infinite;
      }
      .boot-box { position: relative; z-index: 1; width: min(320px, calc(100vw - 48px)); }
      .boot-logo { position: relative; width: 84px; height: 84px; margin: 0 auto 28px; }
      .boot-logo svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .boot-ring { animation: boot-spin 1.6s linear infinite; transform-origin: 50% 50%; }
      .boot-ring2 { animation: boot-spin 2.8s linear infinite reverse; transform-origin: 50% 50%; }
      .boot-mono {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 22px; letter-spacing: 0.04em;
        animation: boot-glitch 2.2s steps(1) infinite;
      }
      .boot-mono b { color: var(--acc); }
      .boot-log { font-size: 11.5px; line-height: 1.75; min-height: 100px; color: var(--dim); }
      .boot-log div { opacity: 0; transform: translateY(4px); animation: boot-line 0.3s ease forwards; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .boot-log .ok { color: var(--ok); }
      .boot-log .acc { color: var(--acc); }
      .boot-bar { height: 2px; margin-top: 14px; background: var(--grid); overflow: hidden; border-radius: 2px; }
      .boot-bar i { display: block; height: 100%; width: 40%; background: var(--acc); box-shadow: 0 0 10px var(--acc); animation: boot-load 1.1s ease-in-out infinite; }
      .boot-meta { display: flex; justify-content: space-between; margin-top: 8px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
      .boot-cursor { display: inline-block; width: 7px; height: 12px; background: var(--acc); vertical-align: -1px; margin-left: 3px; animation: boot-blink 1s steps(1) infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-scan { to { transform: translateY(100vh); } }
      @keyframes boot-line { to { opacity: 1; transform: none; } }
      @keyframes boot-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes boot-blink { 50% { opacity: 0; } }
      @keyframes boot-glitch {
        0%, 86%, 100% { transform: none; text-shadow: none; }
        88% { transform: translate(-2px, 1px); text-shadow: 2px 0 #f43f5e, -2px 0 #22d3ee; }
        92% { transform: translate(2px, -1px); text-shadow: -2px 0 #f43f5e, 2px 0 #22d3ee; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot *, #boot::after { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body class="bg-white dark:bg-[#0a0a0c] text-slate-800 dark:text-slate-100 antialiased font-sans transition-colors duration-200 selection:bg-emerald-500/20 selection:text-emerald-400">
    <!-- Boot loader: pure HTML/CSS so it shows instantly, before the JS bundle arrives -->
    <div id="boot" role="status" aria-label="Loading portfolio">
      <div class="boot-box">
        <div class="boot-logo">
          <svg viewBox="0 0 84 84" fill="none" aria-hidden="true">
            <circle cx="42" cy="42" r="40" stroke="currentColor" stroke-opacity="0.08" stroke-width="1.5" />
            <circle class="boot-ring" cx="42" cy="42" r="40" stroke="var(--acc)" stroke-width="2" stroke-linecap="round" stroke-dasharray="60 192" />
            <circle class="boot-ring2" cx="42" cy="42" r="33" stroke="var(--acc)" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4 8" />
          </svg>
          <div class="boot-mono">K<b>A</b></div>
        </div>
        <div class="boot-log" id="boot-log"></div>
        <div class="boot-bar"><i></i></div>
        <div class="boot-meta"><span>krunal.sys</span><span id="boot-pct">0%</span></div>
      </div>
    </div>
    <script>
      (function () {
        var lines = [
          ['&gt; init portfolio.runtime', ''],
          ['&gt; mounting ui modules', ''],
          ['[ok] kernel.react loaded', 'ok'],
          ['[ok] projects indexed', 'ok'],
          ['&gt; launching interface', 'acc']
        ];
        var log = document.getElementById('boot-log');
        var pct = document.getElementById('boot-pct');
        var i = 0;
        var p = 0;
        var lineTimer = setInterval(function () {
          if (i >= lines.length) return clearInterval(lineTimer);
          var d = document.createElement('div');
          d.className = lines[i][1];
          d.innerHTML = lines[i][0] + (i === lines.length - 1 ? '<span class="boot-cursor"></span>' : '');
          log.appendChild(d);
          i++;
        }, 220);
        var pctTimer = setInterval(function () {
          p = Math.min(p + Math.ceil((96 - p) / 8), 96);
          pct.textContent = p + '%';
        }, 90);
        window.__bootDone = function () {
          window.__bootDone = null;
          clearInterval(lineTimer);
          clearInterval(pctTimer);
          pct.textContent = '100%';
          var el = document.getElementById('boot');
          el.classList.add('boot-done');
          setTimeout(function () { el.remove(); }, 500);
        };
        // Safety net: never trap a visitor behind the loader
        setTimeout(function () { window.__bootDone && window.__bootDone(); }, 8000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
